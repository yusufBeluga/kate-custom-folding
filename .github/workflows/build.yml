name: Build Kate Plugin (Windows x64)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup vcpkg
      run: |
        git clone https://github.com C:\vcpkg
        C:\vcpkg\bootstrap-vcpkg.bat

    - name: Install Dependencies via vcpkg
      run: |
        C:\vcpkg\vcpkg install qtbase:x64-windows ktexteditor:x64-windows kxmlgui:x64-windows kcoreaddons:x64-windows extra-cmake-modules:x64-windows

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" ..

    - name: Build Plugin
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: customfoldingplugin-windows-x64
        path: build/Release/customfoldingplugin.dll
