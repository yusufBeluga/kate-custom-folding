name: Build Kate Plugin (Windows x64)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Installazione Pulita di Vcpkg
      run: |
        git clone --depth=1 https://github.com ${{ github.workspace }}/vcpkg-fresh
        cd ${{ github.workspace }}/vcpkg-fresh
        .\bootstrap-vcpkg.bat

    - name: Installa Dipendenze Core (Qt6 e KF6)
      run: |
        ${{ github.workspace }}/vcpkg-fresh/vcpkg install qtbase:x64-windows extra-cmake-modules:x64-windows kcoreaddons:x64-windows kxmlgui:x64-windows ktexteditor:x64-windows

    - name: Configura CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg-fresh/scripts/buildsystems/vcpkg.cmake" ..

    - name: Compila Plugin C++
      run: |
        cd build
        cmake --build . --config Release

    - name: Rilascia file DLL pronto
      uses: actions/upload-artifact@v4
      with:
        name: customfoldingplugin-windows-x64
        path: build/Release/customfoldingplugin.dll
