name: Build Kate Plugin (Windows x64)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configura Compilatore MSVC Nativo
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configura CMake nativo di sistema
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.24.x'

    - name: Esegui la compilazione pulita
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        cmake --build . --config Release

    - name: Rilascia file DLL pronto
      uses: actions/upload-artifact@v4
      with:
        name: customfoldingplugin-windows-x64
        path: build/Release/customfoldingplugin.dll
