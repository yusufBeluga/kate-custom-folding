name: Build Kate Plugin (Windows x64)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configura Compilatore MSVC Nativo
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configura CMake con Toolchain di Sistema
      run: |
        mkdir build
        cd build
        # Usiamo la copia locale e stabile di vcpkg inclusa nativamente in Visual Studio 2022
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/vcpkg/scripts/buildsystems/vcpkg.cmake" ..

    - name: Compila ed Estrai la DLL
      run: |
        cd build
        cmake --build . --config Release

    - name: Rilascia file DLL pronto
      uses: actions/upload-artifact@v4
      with:
        name: customfoldingplugin-windows-x64
        path: build/Release/customfoldingplugin.dll
