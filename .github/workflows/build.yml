name: Build Kate Plugin (Windows x64)

on: [push, workflow_dispatch]

# Versioni del Kate su cui deve girare il plugin
# (Aiuto -> Informazioni su Kate). Kate 25.12.1 = KDE Frameworks 6.22.0 + Qt 6.10.1
env:
  QT_VERSION: '6.10.1'
  KF_VERSION: '6.22.0'
  # cache binaria di KDE Craft che contiene quella versione di KDE Frameworks
  CRAFT_CACHE: 'https://files.kde.org/craft/Qt6/26.02/windows/cl/msvc2022/x86_64/RelWithDebInfo'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installa Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Attiva compilatore MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Scarica KDE Frameworks ${{ env.KF_VERSION }} (header e librerie)
        shell: pwsh
        run: |
          $packages = @(
            'kde/frameworks/tier3/ktexteditor',
            'kde/frameworks/tier3/kparts',
            'kde/frameworks/tier1/syntax-highlighting',
            'kde/frameworks/tier3/kxmlgui',
            'kde/frameworks/tier1/kconfig',
            'kde/frameworks/tier1/kcoreaddons',
            'kde/frameworks/tier3/kconfigwidgets',
            'kde/frameworks/tier1/kwidgetsaddons',
            'kde/frameworks/tier2/kcompletion',
            'kde/frameworks/tier2/kcolorscheme',
            'kde/frameworks/tier1/kguiaddons',
            'kde/frameworks/tier1/ki18n',
            'kde/frameworks/tier1/kcodecs'
          )
          New-Item -ItemType Directory -Force -Path dl, kf6 | Out-Null
          $kf = [regex]::Escape($env:KF_VERSION)
          foreach ($p in $packages) {
            $name = Split-Path $p -Leaf
            $html = (Invoke-WebRequest "$env:CRAFT_CACHE/$p/" -UseBasicParsing).Content
            # es. ktexteditor-6.22.0-35-20260117T151127-windows-cl-msvc2022-x86_64.7z
            $re = [regex]"$([regex]::Escape($name))-$kf(?:-\d+)*-(\d{8}T\d{6})-windows-cl-msvc2022-x86_64\.7z"
            $found = $re.Matches($html) | Sort-Object { $_.Groups[1].Value } | Select-Object -Last 1
            if (-not $found) { throw "Pacchetto $name $env:KF_VERSION non trovato in $env:CRAFT_CACHE/$p/" }
            $file = $found.Value
            Write-Host "Scarico $file"
            Invoke-WebRequest "$env:CRAFT_CACHE/$p/$file" -OutFile "dl\$file"
            7z x -y -okf6 "dl\$file" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Estrazione fallita: $file" }
          }
          Write-Host "--- include/KF6"
          Get-ChildItem kf6\include\KF6 -Directory | Select-Object -ExpandProperty Name
          Write-Host "--- lib"
          Get-ChildItem kf6\lib -Filter 'KF6*.lib' | Select-Object -ExpandProperty Name

      - name: Compila il plugin
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DKF6_ROOT=$env:GITHUB_WORKSPACE\kf6"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepara la cartella da copiare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\kf6\ktexteditor" | Out-Null
          Copy-Item "build\Release\customfoldingplugin.dll" "dist\kf6\ktexteditor\"

      - name: Carica la DLL
        uses: actions/upload-artifact@v4
        with:
          name: customfoldingplugin-windows-x64
          path: dist
