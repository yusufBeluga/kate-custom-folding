name: Build Kate Plugin (Cross-Compile for Windows)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Installa Compilatore per Windows e Dipendenze
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 cmake extra-cmake-modules \
          qt6-base-dev libkf6texteditor-dev libkf6xmlgui-dev libkf6coreaddons-dev

    - name: Configura CMake per Windows
      run: |
        mkdir build
        cd build
        # Usiamo il toolchain integrato in CMake per compilare un binario Windows a 64-bit
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_SYSTEM_NAME=Windows \
              -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
              -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
              ..

    - name: Compila Plugin C++
      run: |
        cd build
        make

    - name: Rilascia file DLL pronto
      uses: actions/upload-artifact@v4
      with:
        name: customfoldingplugin-windows-x64
        path: build/customfoldingplugin.dll
