name: Build Kate Plugin (Windows x64)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configura Qt6 di Sistema
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.10.1'
        arch: 'win64_msvc2022_64'
        modules: 'qtbase'

    - name: Attiva Compilatore MSVC Nativo
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compilazione C++ via CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        cmake --build . --config Release

    - name: Carica file DLL Pronto
      uses: actions/upload-artifact@v4
      with:
        name: customfoldingplugin-windows-x64
        path: build/Release/customfoldingplugin.dll
