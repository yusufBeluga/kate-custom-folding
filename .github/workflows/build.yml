name: Build Kate Plugin (Windows x64)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup KDE Craft Environment
      uses: kde-looking-glass/setup-craft@v1
      with:
        target: 'kate'

    - name: Configure CMake
      shell: craft {0}
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build Plugin
      shell: craft {0}
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: customfoldingplugin-windows-x64
        path: build/Release/customfoldingplugin.dll
