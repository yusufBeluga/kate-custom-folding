name: Build Kate Plugin (Windows x64)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup KDE Builder & Dependencies
      uses: kde/kde-builder-action@v1
      with:
        # Prepara l'ambiente con le librerie core di Kate ed extra-cmake-modules
        packages: 'ktexteditor kxmlgui kcoreaddons'

    - name: Configura CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Compila Plugin C++
      run: |
        cd build
        cmake --build . --config Release

    - name: Rilascia file DLL pronto
      uses: actions/upload-artifact@v4
      with:
        name: customfoldingplugin-windows-x64
        path: build/Release/customfoldingplugin.dll
