name: Build Kate Plugin (Windows x64)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configura Compilatore MSVC Nativo
      uses: ilammy/msvc-dev-cmd@v1

    - name: Scarica e Configura KDE Craft Environment
      run: |
        git clone --depth=1 https://kde.org C:\craft
        cd C:\craft
        python craft-bootstrap.py --target-dir C:\CraftRoot --architecture x64

    - name: Installa Librerie Core e ECM tramite Craft
      shell: powershell
      run: |
        & C:\CraftRoot\dev-utils\bin\craft.ps1 -i extra-cmake-modules ktexteditor kxmlgui kcoreaddons

    - name: Configura CMake
      shell: powershell
      run: |
        & C:\CraftRoot\dev-utils\bin\craft.ps1
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Compila ed Estrai la DLL
      run: |
        cd build
        cmake --build . --config Release

    - name: Rilascia file DLL pronto
      uses: actions/upload-artifact@v4
      with:
        name: customfoldingplugin-windows-x64
        path: build/Release/customfoldingplugin.dll
