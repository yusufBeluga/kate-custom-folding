name: Build Kate Plugin (Windows x64)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Inizializza Vcpkg Aggiornato
      uses: johnwason/vcpkg-action@v1
      with:
        pkgs: qtbase extra-cmake-modules kcoreaddons kxmlgui ktexteditor
        triplet: x64-windows
        token: ${{ github.token }}

    - name: Configura CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" ..

    - name: Compila Plugin C++
      run: |
        cd build
        cmake --build . --config Release

    - name: Rilascia file DLL pronto
      uses: actions/upload-artifact@v4
      with:
        name: customfoldingplugin-windows-x64
        path: build/Release/customfoldingplugin.dll
